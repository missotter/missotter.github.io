{{ define "main" }}
  <article class="magazine-container" style="padding-top: 4rem; padding-bottom: 6rem; max-width: 950px;">
    <div style="margin-bottom: 2.5rem;">
      <a href="{{ "/" | relURL }}" style="font-family: sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--turquoise); font-weight: bold;">&larr; Back to Home</a>
    </div>

    <header style="border-bottom: 1px solid var(--text-color); padding-bottom: 2.5rem; margin-bottom: 3rem; background: transparent; display: grid; grid-template-columns: 220px 1fr; gap: 3rem; align-items: baseline;">
      <div>
        <div style="font-family: sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--turquoise); font-weight: bold;">
          {{ .Date.Format "January 2, 2006" }} &bull; {{ with .Params.categories }}{{ index . 0 }}{{ else }}Dispatch{{ end }}
        </div>
      </div>
      <div>
        <h1 style="font-family: Georgia, serif; font-size: 2.4rem; font-style: italic; font-weight: normal; line-height: 1.2; margin-bottom: 1rem;">{{ .Title }}</h1>
        {{ with .Description }}
        <p style="font-size: 1.15rem; color: var(--muted-text); line-height: 1.6;">{{ . }}</p>
        {{ end }}
      </div>
    </header>

    <div class="article-body" style="font-size: 1.1rem; line-height: 1.8; color: var(--text-color);">
      {{ .Content }}
    </div>

    <div style="margin-top: 6rem; padding-top: 2rem; border-top: 1px solid var(--text-color); display: flex; justify-content: space-between; align-items: center;">
      <a href="{{ "/" | relURL }}" style="font-family: sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: bold; color: var(--text-color);">&larr; Return to Dispatches</a>
      <span style="font-family: sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-text);">Atsuno Takase</span>
    </div>
  </article>
{{ end }}
